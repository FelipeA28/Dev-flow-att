name: CI/CD Pipeline
on:
push:
branches: [main]
4 ypr:
build-and-test:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v3
- uses: actions/setup-node@v3
with:
node-version: ‘16’
- run: npm install
- run: npm test
deploy:
needs: build-and-test
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v3
- name: Configurar Conexão SSH
env:
SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
run: |
mkdir -p ~/.ssh

printf “%s” “$SSH_KEY” &gt; ~/.ssh/id_rsa
chmod 600 ~/.ssh/id_rsa
ssh-keyscan -H IP_DO_SERVIDOR &gt;&gt; ~/.ssh/known_hosts
- name: Executar Deploy
run: ssh user@IP_DO_SERVIDOR “bash deploy_script.sh”
